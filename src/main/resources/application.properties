spring.application.name=hospital-backend
server.port=${PORT:8080}

# Database (all values come from environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/careplus_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA (Flyway creates tables, Hibernate only validates)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true

# App
app.timezone=Asia/Kolkata
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
app.security.max-login-attempts=5
app.security.login-block-minutes=15

# Server hardening
server.forward-headers-strategy=native
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Database pool, logging, health
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000
logging.level.com.careplus=INFO
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Admin and JWT (values come from environment variables)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiry-minutes=120
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.full-name=${ADMIN_FULL_NAME:Hospital Administrator}